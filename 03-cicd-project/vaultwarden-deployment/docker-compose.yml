networks:
  frontend:
  internal:
    internal: true
services:
  vaultwarden:
    build: .
    container_name: vaultwarden
    user: "1000:1000"
    networks: [internal]
    restart: unless-stopped
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN}
    volumes:
      - ./vw-data/:/data/
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:444:443"
    networks: [internal, frontend]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      vaultwarden:
        condition:
          service_healthy

volumes:
  caddy_data:
  caddy_config:
  